replicaCount: 3

ingress:
  host: store.example.com
  tls:
    enabled: true
    secretName: volt-store-tls

networkPolicy:
  ingressCIDR: 10.40.16.0/24

autoscaling:
  minReplicas: 3
  maxReplicas: 10

podDisruptionBudget:
  minAvailable: 2

resources:
  requests:
    cpu: 200m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 512Mi