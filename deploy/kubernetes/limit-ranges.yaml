apiVersion: v1
kind: LimitRange
metadata:
  name: volt-store-container-limits
  namespace: volt-store-prod
spec:
  limits:
    - type: Container
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "4"
        memory: 4Gi
      defaultRequest:
        cpu: 200m
        memory: 192Mi
      default:
        cpu: 1
        memory: 512Mi