apiVersion: v1
kind: ResourceQuota
metadata:
  name: volt-store-quota
  namespace: volt-store-dev
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: volt-store-quota
  namespace: volt-store-staging
spec:
  hard:
    pods: "15"
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "12"
    limits.memory: 24Gi
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: volt-store-quota
  namespace: volt-store-prod
spec:
  hard:
    pods: "25"
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    services: "10"